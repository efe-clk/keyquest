name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (ör. v0.1.0). Verilirse etiket ve Release bu commit'ten oluşturulur; boşsa yalnızca derlenir."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    # The AppImage runs on distributions with this glibc or newer.
    runs-on: ubuntu-24.04
    # A hung package mirror would otherwise hold the job for 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev file desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./build-aux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KeyQuest-AppImage
          path: target/KeyQuest-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created from the commit that was built.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Linux x86_64 AppImage. İndirip çalıştırılabilir yapın ve açın:
            `chmod +x KeyQuest-*.AppImage && ./KeyQuest-*.AppImage`
            GTK 4 ve libadwaita paketin içindedir; glibc 2.39 veya daha yenisi gerekir.
          files: target/KeyQuest-*.AppImage

name: Rust

on:
  push:
    branches: [ "claude/ecstatic-curie-3emfs7" ]
  pull_request:
    branches: [ "claude/ecstatic-curie-3emfs7" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    # A hung package mirror would otherwise hold the job for 6 hours.

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install GTK 4 and libadwaita
      run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

[workspace]
resolver = "3"
members = ["crates/keyquest-core", "crates/keyquest-data", "crates/keyquest-cli", "crates/keyquest-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/efe-clk/keyquest"

[workspace.dependencies]
keyquest-core = { path = "crates/keyquest-core" }
keyquest-data = { path = "crates/keyquest-data" }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
crossterm = "0.29"
tempfile = "3"

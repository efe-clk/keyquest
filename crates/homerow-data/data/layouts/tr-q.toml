# Türkçe Q düzeni (xkb: tr).
# Parmak kodu: L/R (el) + 0 başparmak, 1 işaret, 2 orta, 3 yüzük, 4 serçe.
# Ölü tuşlar (ör. AltGr+ğ → ¨) dahil edilmemiştir.
format = 1
id = "tr-q"
name = "Türkçe Q"

[[rows]]
keys = [
  { code = "KEY_GRAVE", base = '"', shift = "é", altgr = "<", finger = "L4" },
  { code = "KEY_1", base = "1", shift = "!", altgr = ">", finger = "L4" },
  { code = "KEY_2", base = "2", shift = "'", altgr = "£", finger = "L3" },
  { code = "KEY_3", base = "3", shift = "^", altgr = "#", finger = "L2" },
  { code = "KEY_4", base = "4", shift = "+", altgr = "$", finger = "L1" },
  { code = "KEY_5", base = "5", shift = "%", altgr = "½", finger = "L1" },
  { code = "KEY_6", base = "6", shift = "&", finger = "R1" },
  { code = "KEY_7", base = "7", shift = "/", altgr = "{", finger = "R1" },
  { code = "KEY_8", base = "8", shift = "(", altgr = "[", finger = "R2" },
  { code = "KEY_9", base = "9", shift = ")", altgr = "]", finger = "R3" },
  { code = "KEY_0", base = "0", shift = "=", altgr = "}", finger = "R4" },
  { code = "KEY_MINUS", base = "*", shift = "?", altgr = '\', finger = "R4" },
  { code = "KEY_EQUAL", base = "-", shift = "_", altgr = "|", finger = "R4" },
]

[[rows]]
keys = [
  { code = "KEY_Q", base = "q", shift = "Q", altgr = "@", finger = "L4" },
  { code = "KEY_W", base = "w", shift = "W", finger = "L3" },
  { code = "KEY_E", base = "e", shift = "E", altgr = "€", finger = "L2" },
  { code = "KEY_R", base = "r", shift = "R", finger = "L1" },
  { code = "KEY_T", base = "t", shift = "T", altgr = "₺", finger = "L1" },
  { code = "KEY_Y", base = "y", shift = "Y", finger = "R1" },
  { code = "KEY_U", base = "u", shift = "U", finger = "R1" },
  { code = "KEY_I", base = "ı", shift = "I", finger = "R2" },
  { code = "KEY_O", base = "o", shift = "O", finger = "R3" },
  { code = "KEY_P", base = "p", shift = "P", finger = "R4" },
  { code = "KEY_LEFTBRACE", base = "ğ", shift = "Ğ", finger = "R4" },
  { code = "KEY_RIGHTBRACE", base = "ü", shift = "Ü", finger = "R4" },
]

[[rows]]
keys = [
  { code = "KEY_A", base = "a", shift = "A", altgr = "æ", finger = "L4", home = true },
  { code = "KEY_S", base = "s", shift = "S", altgr = "ß", finger = "L3", home = true },
  { code = "KEY_D", base = "d", shift = "D", finger = "L2", home = true },
  { code = "KEY_F", base = "f", shift = "F", finger = "L1", home = true },
  { code = "KEY_G", base = "g", shift = "G", finger = "L1" },
  { code = "KEY_H", base = "h", shift = "H", finger = "R1" },
  { code = "KEY_J", base = "j", shift = "J", finger = "R1", home = true },
  { code = "KEY_K", base = "k", shift = "K", finger = "R2", home = true },
  { code = "KEY_L", base = "l", shift = "L", finger = "R3", home = true },
  { code = "KEY_SEMICOLON", base = "ş", shift = "Ş", finger = "R4", home = true },
  { code = "KEY_APOSTROPHE", base = "i", shift = "İ", finger = "R4" },
  { code = "KEY_BACKSLASH", base = ",", shift = ";", finger = "R4" },
]

[[rows]]
keys = [
  { code = "KEY_102ND", base = "<", shift = ">", altgr = "|", finger = "L4" },
  { code = "KEY_Z", base = "z", shift = "Z", finger = "L4" },
  { code = "KEY_X", base = "x", shift = "X", finger = "L3" },
  { code = "KEY_C", base = "c", shift = "C", finger = "L2" },
  { code = "KEY_V", base = "v", shift = "V", finger = "L1" },
  { code = "KEY_B", base = "b", shift = "B", finger = "L1" },
  { code = "KEY_N", base = "n", shift = "N", finger = "R1" },
  { code = "KEY_M", base = "m", shift = "M", finger = "R1" },
  { code = "KEY_COMMA", base = "ö", shift = "Ö", finger = "R2" },
  { code = "KEY_DOT", base = "ç", shift = "Ç", finger = "R3" },
  { code = "KEY_SLASH", base = ".", shift = ":", finger = "R4" },
]

[modifiers]
shift_left  = "L4"
shift_right = "R4"
altgr       = "R0"
space       = "R0"

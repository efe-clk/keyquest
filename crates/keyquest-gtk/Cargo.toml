[package]
name = "keyquest-gtk"
description = "KeyQuest masaüstü arayüzü (GTK 4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keyquest"
path = "src/main.rs"

[dependencies]
keyquest-core.workspace = true
keyquest-data.workspace = true
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22"
